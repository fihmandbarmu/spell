<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids English Adventure</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --yellow: #FFE66D;
      --dark: #2C3E50;
      --light: #F7F9FC;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--light);
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: var(--primary);
      font-size: 2.5rem;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 0px var(--yellow);
    }

    .nav-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .tab-btn {
      background-color: white;
      border: 3px solid var(--dark);
      padding: 12px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 var(--dark);
    }

    .tab-btn.active {
      background-color: var(--yellow);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--dark);
    }

    .card {
      background: white;
      border: 4px solid var(--dark);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 0 var(--dark);
      text-align: center;
      display: none;
    }

    .card.active {
      display: block;
    }

    .word-display {
      font-size: 3rem;
      color: var(--primary);
      margin: 15px 0;
      text-transform: capitalize;
    }

    .phonetic-display {
      font-size: 1.4rem;
      color: #7F8C8D;
      margin-bottom: 15px;
    }

    .definition {
      font-size: 1.1rem;
      margin-bottom: 25px;
      background: #EDF2F7;
      padding: 15px;
      border-radius: 12px;
    }

    .btn {
      background-color: var(--secondary);
      color: white;
      border: 3px solid var(--dark);
      padding: 15px 30px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--dark);
      transition: all 0.1s ease;
      margin: 5px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--dark);
    }

    .btn-next {
      background-color: var(--yellow);
      color: var(--dark);
    }

    .mic-btn {
      background-color: #FF7675;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
    }

    .mic-btn.listening {
      animation: pulse 1.2s infinite;
      background-color: #55EFC4;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .feedback {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 15px;
      min-height: 30px;
    }

    .feedback.correct { color: #2ECC71; }
    .feedback.incorrect { color: #E74C3C; }

    input[type="text"] {
      width: 80%;
      padding: 12px;
      font-size: 1.2rem;
      border: 3px solid var(--dark);
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Word Explorer 🌟</h1>
    <p>Learn over 63,000+ English words!</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('listen')">🎧 Listen to Me</button>
    <button class="tab-btn" onclick="switchTab('speak')">🗣️ Speak to Me</button>
  </div>

  <!-- LISTEN TO ME MODE -->
  <div id="listen-mode" class="card active">
    <h2>Listen & Learn</h2>
    <div class="word-display" id="listen-word">Cat</div>
    <div class="phonetic-display" id="listen-phonetic">/kæt/</div>
    <div class="definition" id="listen-def">A small domesticated carnivorous mammal.</div>
    
    <button class="btn" onclick="speakCurrentWord()">🔊 Listen</button>
    <button class="btn btn-next" onclick="loadRandomWord('listen')">➡️ Next Word</button>
  </div>

  <!-- SPEAK TO ME MODE -->
  <div id="speak-mode" class="card">
    <h2>Speak the Word</h2>
    
    <input type="text" id="custom-word-input" placeholder="Enter any English word...">
    <button class="btn" onclick="loadCustomWord()">Search Word</button>

    <hr style="margin: 20px 0; border: 1px solid #ddd;">

    <div class="word-display" id="speak-word">Apple</div>
    <div class="phonetic-display" id="speak-phonetic">How to say: /ˈæp.əl/</div>
    <button class="btn" style="padding: 5px 15px; font-size: 0.9rem;" onclick="speakCurrentWord('speak')">🔊 Hear Example</button>

    <button class="btn mic-btn" id="mic-btn" onclick="startListening()">🎙️</button>
    <div class="feedback" id="feedback">Press the mic and say the word!</div>
    
    <br>
    <button class="btn btn-next" onclick="loadRandomWord('speak')">🎲 Random Word</button>
  </div>

  <script>
    // Sample kid-friendly starting pool (app dynamically fetches 63,000+ words via Dictionary API)
    const kidWords = ["apple", "banana", "elephant", "guitar", "sunflower", "dolphin", "rainbow", "dinosaur", "rocket", "butterfly"];

    let currentListenWord = "";
    let currentSpeakWord = "";
    let recognition = null;

    // Initialize Web Speech API for Speech Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
        checkSpeech(spokenWord);
      };

      recognition.onerror = function() {
        showFeedback("Didn't catch that. Try again!", "incorrect");
        stopMicAnimation();
      };

      recognition.onend = function() {
        stopMicAnimation();
      };
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));

      if (tab === 'listen') {
        document.getElementById('listen-mode').classList.add('active');
        event.target.classList.add('active');
        if (!currentListenWord) loadRandomWord('listen');
      } else {
        document.getElementById('speak-mode').classList.add('active');
        event.target.classList.add('active');
        if (!currentSpeakWord) loadRandomWord('speak');
      }
    }

    async function fetchWordDetails(word) {
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (!response.ok) throw new Error('Word not found');
        const data = await response.json();
        
        const phonetic = data[0].phonetic || (data[0].phonetics.find(p => p.text)?.text) || "N/A";
        const definition = data[0].meanings[0]?.definitions[0]?.definition || "A broad vocabulary word.";

        return { word: data[0].word, phonetic, definition };
      } catch (err) {
        return { word, phonetic: "Pronunciation ready", definition: "Explore and speak this word!" };
      }
    }

    async function loadRandomWord(mode) {
      const randomWord = kidWords[Math.floor(Math.random() * kidWords.length)];
      const details = await fetchWordDetails(randomWord);

      if (mode === 'listen') {
        currentListenWord = details.word;
        document.getElementById('listen-word').innerText = details.word;
        document.getElementById('listen-phonetic').innerText = details.phonetic;
        document.getElementById('listen-def').innerText = details.definition;
      } else {
        currentSpeakWord = details.word;
        document.getElementById('speak-word').innerText = details.word;
        document.getElementById('speak-phonetic').innerText = `How to say: ${details.phonetic}`;
        document.getElementById('feedback').innerText = "Press the mic and say the word!";
        document.getElementById('feedback').className = "feedback";
      }
    }

    async function loadCustomWord() {
      const input = document.getElementById('custom-word-input').value.trim().toLowerCase();
      if (!input) return;

      const details = await fetchWordDetails(input);
      currentSpeakWord = details.word;
      document.getElementById('speak-word').innerText = details.word;
      document.getElementById('speak-phonetic').innerText = `How to say: ${details.phonetic}`;
      document.getElementById('feedback').innerText = "Press the mic and say the word!";
      document.getElementById('feedback').className = "feedback";
    }

    function speakCurrentWord(mode = 'listen') {
      const text = mode === 'listen' ? currentListenWord : currentSpeakWord;
      if (!text) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.8; // Slower rate for children
      window.speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) {
        alert("Speech recognition is not supported in this browser. Try Google Chrome!");
        return;
      }
      document.getElementById('mic-btn').classList.add('listening');
      document.getElementById('feedback').innerText = "Listening...";
      document.getElementById('feedback').className = "feedback";
      recognition.start();
    }

    function stopMicAnimation() {
      document.getElementById('mic-btn').classList.remove('listening');
    }

    function checkSpeech(spoken) {
      const target = currentSpeakWord.toLowerCase().trim();
      if (spoken === target || spoken.includes(target)) {
        showFeedback(`🎉 Awesome! You said: "${spoken}"`, "correct");
      } else {
        showFeedback(`Try again! You said "${spoken}", expected "${target}".`, "incorrect");
      }
    }

    function showFeedback(text, statusClass) {
      const fb = document.getElementById('feedback');
      fb.innerText = text;
      fb.className = `feedback ${statusClass}`;
    }

    // Load initial data
    loadRandomWord('listen');
  </script>
</body>
</html>
