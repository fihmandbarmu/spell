<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids English Adventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Word Explorer 🌟</h1>
    <p>Learn over 63,000+ English words!</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('listen')">🎧 Listen to Me</button>
    <button class="tab-btn" onclick="switchTab('speak')">🗣️ Speak to Me</button>
  </div>

  <!-- LISTEN TO ME MODE -->
  <div id="listen-mode" class="card active">
    <h2>Listen & Learn</h2>
    <div class="word-display" id="listen-word">Loading...</div>
    <div class="phonetic-display" id="listen-phonetic">...</div>
    <div class="definition" id="listen-def">...</div>
    
    <button class="btn" onclick="speakCurrentWord('listen')">🔊 Listen</button>
    <button class="btn btn-next" onclick="loadRandomWord('listen')">➡️ Next Word</button>
  </div>

  <!-- SPEAK TO ME MODE -->
  <div id="speak-mode" class="card">
    <h2>Speak the Word</h2>
    
    <input type="text" id="custom-word-input" placeholder="Type any word (e.g. dinosaur)...">
    <button class="btn" onclick="loadCustomWord()">Search Word</button>

    <hr style="margin: 20px 0; border: 1px solid #ddd;">

    <div class="word-display" id="speak-word">Loading...</div>
    <div class="phonetic-display" id="speak-phonetic">How to say: ...</div>
    <button class="btn btn-small" onclick="speakCurrentWord('speak')">🔊 Hear Example</button>

    <button class="btn mic-btn" id="mic-btn" onclick="startListening()">🎙️</button>
    <div class="feedback" id="feedback">Press the mic and say the word!</div>
    
    <br>
    <button class="btn btn-next" onclick="loadRandomWord('speak')">🎲 Random Word</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
